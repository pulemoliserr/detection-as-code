rule: Web SQL Injection Attempt
match:
  - cs-method: GET
    cs-uri-stem: '/products'
    cs-uri-query: "id=1 UNION SELECT username,password FROM users--"
    c-ip: '203.0.113.12'
  - cs-method: GET
    cs-uri-stem: '/login'
    cs-uri-query: "user=admin'+or+1=1--"
    c-ip: '203.0.113.12'
nomatch:
  - cs-method: GET
    cs-uri-stem: '/products'
    cs-uri-query: 'id=42&category=toys'
    c-ip: '10.0.0.5'
  - cs-method: GET
    cs-uri-stem: '/search'
    cs-uri-query: 'q=selection+of+union+jack+flags'
    c-ip: '10.0.0.5'
