title: PowerShell Download Cradle
id: 18f49bc9-b3da-412d-beda-f9e425ba6774
status: experimental
description: |
  Detects PowerShell command lines that download content from a URL, a common
  first stage for loading malware or attack tools (e.g. IEX + DownloadString).
references:
  - https://attack.mitre.org/techniques/T1105/
author: YOUR NAME
date: 2026-11-13
tags:
  - attack.execution
  - attack.command-and-control
  - attack.t1059.001
  - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_download:
    CommandLine|contains:
      - 'DownloadString('
      - 'DownloadFile('
      - 'DownloadData('
      - 'Invoke-WebRequest'
      - 'iwr '
      - 'Start-BitsTransfer'
      - 'Net.WebClient'
  selection_url:
    CommandLine|contains: 'http'
  condition: all of selection_*
falsepositives:
  - Admin scripts that download installers from internal servers
level: medium
