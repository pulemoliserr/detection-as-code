title: Office Application Spawning a Shell or Script Host
id: 7b7d383b-e563-41d4-b81f-6c72c727ee31
status: experimental
description: |
  Detects Word, Excel, PowerPoint or Outlook starting a command shell or script
  interpreter. This is typical of malicious macros delivered by phishing.
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1204/002/
author: YOUR NAME
date: 2026-11-13
tags:
  - attack.initial-access
  - attack.execution
  - attack.t1566.001
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: all of selection_*
falsepositives:
  - Rare legitimate add-ins
level: high
