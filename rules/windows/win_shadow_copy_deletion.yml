title: Shadow Copy or Backup Catalog Deletion
id: 0feef449-a3ad-4061-a1fd-d736635a383f
status: experimental
description: |
  Detects deletion of Volume Shadow Copies, the Windows backup catalog, or disabling
  of recovery mode. Ransomware does this just before encrypting files so victims
  can't restore them.
references:
  - https://attack.mitre.org/techniques/T1490/
author: Pule Molise
date: 2026-11-13
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'catalog'
  selection_bcdedit:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains|all:
      - 'recoveryenabled'
      - 'no'
  condition: 1 of selection_*
falsepositives:
  - Planned storage maintenance by administrators (rare)
level: critical
